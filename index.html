<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Legacy Drop</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: #fdf3ec;
    color: #2a2320;
  }
  header {
    background: #fdf3ec;
    padding: 20px 6vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #f0ddd0;
  }
  header nav {
    display: flex;
    gap: 28px;
  }
  header nav a {
    color: #c8283c;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
  }
  header .brand {
    font-size: 26px;
    color: #c8283c;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-align: center;
  }
  header .cta {
    background: #c8283c;
    color: #fff;
    padding: 12px 22px;
    border-radius: 30px;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  @media (max-width: 640px) {
    header { flex-wrap: wrap; gap: 12px; }
    header nav { order: 1; }
    header .brand { order: 0; width: 100%; }
    header .cta { order: 2; }
  }
  main { max-width: 1100px; margin: 0 auto; padding: 0 6vw; }
  .shot {
    width: 100%;
    display: block;
    border-radius: 10px;
    margin: 40px 0;
    box-shadow: 0 12px 30px rgba(0,0,0,0.12);
  }
  .intro {
    text-align: center;
    padding: 50px 0 10px;
  }
  .intro h1 {
    font-size: 34px;
    color: #c8283c;
    margin-bottom: 12px;
  }
  .intro p {
    font-size: 16px;
    color: #5a4c45;
    max-width: 560px;
    margin: 0 auto;
    line-height: 1.6;
  }
  footer {
    text-align: center;
    padding: 40px 6vw 60px;
    color: #8a7b73;
    font-size: 13px;
    font-family: Arial, sans-serif;
  }
  footer a { color: #c8283c; text-decoration: none; }
</style>
</head>
<body>

<header>
  <nav>
    <a href="#">Home</a>
    <a href="#">Contact</a>
  </nav>
  <div class="brand">The Legacy Drop</div>
  <a href="#" class="cta">Start an Order</a>
</header>

<main>
  <div class="intro">
    <h1>Custom Merch. Quick. Easy. Yours.</h1>
    <p>A look back at The Legacy Drop — custom-made merch, designed and delivered fast.</p>
  </div>

  <img class="shot" src="images/hero.png" alt="The Legacy Drop homepage hero">
  <img class="shot" src="images/section2.png" alt="The Legacy Drop merch showcase">
</main>

<footer>
  &copy; The Legacy Drop
</footer>

</body>
</html>
